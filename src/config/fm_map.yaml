# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket_trust: ticket text (injected delay, fake authority) over DB facts
stale_policy: FM-06            # stale_clause: superseded or not-yet-effective clause
clause_sum: FM-04              # sum_parts: summing clauses instead of taking the max
double_deduct: FM-05           # pre_deducted: agent subtracts a prior refund the host also subtracts
sibling_refund: FM-07          # sibling_refund: money written under another claim of the same order
denied_ignored: FM-02          # ignore_denied: host refuses (expired approval, already refunded), agent says resolved
reply_ledger_mismatch: FM-08   # misreport: reply states an amount the ledger does not hold
cross_principal: FM-09         # cross_principal: another principal's order or PII
